openapi: 3.0.3

info:
  title: Movie Theater Seat Reservation API
  version: 1.0.0
  description: >
    This API allows movie theater customers to
    view available seats, reserve seats for a
    selected showtime, and cancel unpaid
    reservations. It also handles invalid
    showtimes, unavailable seats, and
    reservations that cannot be canceled.

servers:
  - url: https://movie.reservation.com/v1

paths:
  /showtimes/{showtimeId}/seats:
    get:
      summary: Get available seats for a showtime
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved seats
          content:
            application/json:
              schema:
                type: object
                properties:
                  showtimeId:
                    type: string
                  availableSeats:
                    type: array
                    items:
                      type: string
        '404':
          description: Showtime not found

  /reservations:
    post:
      summary: Reserve seats for a movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - showtimeId
                - seatIds
              properties:
                showtimeId:
                  type: string
                seatIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '201':
          description: Reservation successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservationId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid reservation request
        '409':
          description: Selected seats are unavailable

  /reservations/{reservationId}:
    delete:
      summary: Cancel an unpaid seat reservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reservation successfully canceled
        '404':
          description: Reservation not found
        '409':
          description: Reservation already paid
